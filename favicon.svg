<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Dark Rounded Square -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0a0e17" stroke="url(#cyberGrad)" stroke-width="2.5"/>
  
  <!-- Terminal Prompt Icon -->
  <path d="M16 22 L28 32 L16 42" fill="none" stroke="url(#cyberGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Terminal Cursor -->
  <line x1="34" y1="42" x2="48" y2="42" stroke="#00e5ff" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
</svg>
